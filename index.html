<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;700&family=Pixelify+Sans:wght@400..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="header-container">
            <div class="logo-header-container">
                <img src="assets/images/FL-logo-white.svg" alt="logo FL" class="logo-header">
                <h1 href="#" class="name-header">FÉLIX_Lévesque</h1>
            </div>
            <div class="bar-header"></div>
            <nav class="nav-header">
                <a href="#" class="link-header">Projets</a>
                <a href="#" class="link-header">À propos</a>
                <a href="#" class="link-header">Contact</a>
            </nav>
        </div>
    </header>
    <main>
        <!-- Hero -->
        <section class="hero">
            <div class="hero-container">
                <div class="hero-content">

                    <div class="hero-bg-bar"></div>
                </div>
                <div class="hero-projects">

                </div>
            </div>
            <img src="assets/images/FL-logo-lblue.svg" class="logo-bg-hero">
        </section>
        <!-- Projets -->
        <section class="projects">
            <div class="projects-container">
                <div class="projects-title">
                    <h2 class="projets-title-projets">Projets</h2>
                    <div class="projects-bar"></div>
                    <h2 class="projects-title-01">[-01-]</h2>
                </div>
                <div class="projets-list">
                    <div class="projet-item">
                        <img class="card-image">
                        <div class="card-info">
                            <h3 class="card-title"></h3>
                            <p class="card-type"></p>
                            <p class="card-year"></p>
                        </div>
                        <button class="card-button">></button>
                    </div>
                </div>
            </div>
        </section>
    </main>
    <!-- Footer -->
    <footer class="footer">

    </footer>
</body>
</html>
